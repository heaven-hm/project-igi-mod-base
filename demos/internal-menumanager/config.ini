; Copy beside the internal DLL/dylib. The menu reads this file on startup.
[mod_menu]
enabled=true
hotkey=F5
screen_id=990
x=95
y=185
width=455
height=300
; display_add_frame_callback (per-frame callback), screen_draw, display_end_frame, text_draw, or game_run_handler.
hook=display_add_frame_callback
; trace, debug, info, warning, error, critical
log_level=debug
; A console window is always created for Debug builds; Release honours this key.
console=true

[mod_menu.items]
weather=list,Weather,IGI_SDK_SetWeather(this.value),rain,snow,clear
weapons=action,Give All Weapons,IGI_SDK_GiveAllWeapons()
frames=toggle,Frame Limit,IGI_SDK_ToggleFrameLimit(),true
free_camera=toggle,Free Camera,IGI_SDK_ToggleFreeCamera(),false
ammo=toggle,Unlimited Ammo,IGI_SDK_ToggleUnlimitedAmmo(),false
health=toggle,Invulnerability,IGI_SDK_ToggleInvulnerability(),false
speed=slider,Player Speed,IGI_SDK_SetPlayerSpeed(this.value)
logs=toggle,Runtime Logs,IGI_SDK_ToggleRuntimeLogs(),true

; Only the section matching the running build is applied, so one file can serve
; a Debug and a Release deployment.
[mod_menu.debug]
log_level=trace
console=true

[mod_menu.release]
log_level=info
console=false

[mod_menu]
enabled=true
; Start key opens/initializes the menu (F3-F12, Home, End, PageUp, PageDown,
; Insert, Delete).
start_key=F5
; End key closes the menu and unloads the SDK. Set to none to keep the SDK
; loaded so the game keeps running unmodified.
end_key=F12
; Internal menus always run script natives on the game-thread frame callback.
native_mode=hooked
screen_id=990
x=95
y=185
width=455
height=300
; Gameplay scheduler hook for the supported IGI 1 executable.
; Display_AddFrameCallback at 0x004916C0 registers the SDK tick into the game's
; per-frame callback list, so the scheduler runs once per displayed frame.
; Game_RunHandler is no longer accepted.
hook=display_add_frame_callback
; trace, debug, info, warning, error, critical
log_level=debug
; Debug builds create a console; Release builds write file logs only.
console=false

[mod_menu.items]
; Menu items and list values come from this file. Weather values are on/off;
; the adapter translates them to the two-byte value Game_SetRaining reads.
weather=list,Rain,IGI_SDK_SetWeather(this.value),off,on
ammo=action,Enable Unlimited Ammo,IGI_SDK_EnableUnlimitedAmmo()
frames=toggle,Frame Limit,IGI_SDK_ToggleFrameLimit(),true
music=list,Music Volume,IGI_SDK_SetMusicVolume(this.value),mute,low,normal
display=action,Refresh Display,IGI_SDK_RefreshDisplay()
diagnostics=action,Log Game State,IGI_SDK_LogGameState()

; Only the section matching the running build is applied, so one file can serve
; a Debug and a Release deployment.
[mod_menu.debug]
log_level=trace
console=true

[mod_menu.release]
log_level=info
console=false

; Copy beside the internal DLL/dylib. The menu reads this file on startup.
[mod_menu]
enabled=true
; Start key opens the menu.
hotkey=F5
; End key closes the menu and unloads the SDK (F3-F8, Home, End, PageUp,
; PageDown, Insert, Delete). Set to none to keep the SDK loaded.
exit_key=End
screen_id=990
x=95
y=185
width=455
height=300
; Gameplay scheduler hook for the supported IGI 1 executable.
; Only game_run_handler is accepted; the runtime refuses other hooks.
hook=game_run_handler
; trace, debug, info, warning, error, critical
log_level=debug
; Debug builds create a console; Release builds write file logs only.
console=true

[mod_menu.items]
; These definitions currently populate the SDK model only. Their action strings
; are not registered game script functions and do not change game state yet.
weather=list,Weather,IGI_SDK_SetWeather(this.value),rain,snow,clear
weapons=action,Give All Weapons,IGI_SDK_GiveAllWeapons()
frames=toggle,Frame Limit,IGI_SDK_ToggleFrameLimit(),true
free_camera=toggle,Free Camera,IGI_SDK_ToggleFreeCamera(),false
ammo=toggle,Unlimited Ammo,IGI_SDK_ToggleUnlimitedAmmo(),false
health=toggle,Invulnerability,IGI_SDK_ToggleInvulnerability(),false
speed=slider,Player Speed,IGI_SDK_SetPlayerSpeed(this.value)
logs=toggle,Runtime Logs,IGI_SDK_ToggleRuntimeLogs(),true

; Only the section matching the running build is applied, so one file can serve
; a Debug and a Release deployment.
[mod_menu.debug]
log_level=trace
console=true

[mod_menu.release]
log_level=info
console=false

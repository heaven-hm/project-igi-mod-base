[mod_menu]
enabled=true
; Start key opens/initializes the menu (F3-F12, Home, End, PageUp, PageDown,
; Insert, Delete).
start_key=F5
; End key closes the menu and stops its hooks. The injected DLL stays mapped
; safely until igi.exe exits. Set to none to disable this action.
end_key=F12
; The internal menu is created only from the game frame callback.
native_mode=hooked
screen_id=990
x=95
y=185
width=455
height=300
; Gameplay scheduler hook for the supported IGI 1 executable.
; Display_AddFrameCallback at 0x004916C0 registers the SDK tick into the game's
; per-frame callback list, so the scheduler runs once per displayed frame.
; Game_RunHandler is no longer accepted.
hook=display_add_frame_callback
; trace, debug, info, warning, error, critical
log_level=debug
log_file=project-igi-mod.log
; Debug builds create a console; Release builds write file logs only.
console=false

; Only the section matching the running build is applied, so one file can serve
; a Debug and a Release deployment.
[mod_menu.debug]
log_level=trace
console=true

[mod_menu.release]
log_level=info
console=false

; Dear ImGui (Direct3D 7) external mod menu settings.
[imgui]
; Initial window position and size in pixels.
x=95
y=80
width=460
height=400
; Color theme: dark, light, classic
theme=dark
; Global window/UI opacity (0.20 to 1.00) and font scale (0.50 to 2.50).
alpha=0.95
font_scale=1.00
; Styling parameters in pixels.
window_rounding=6.0
frame_rounding=4.0
border_size=1.0
; Behavior and window flags.
pause_game=true
show_fps=true
show_status=true
movable=true
resizable=true
collapsible=false
auto_resize=false
mouse_cursor=true
keyboard_nav=true
; Persist moved/resized window state across sessions when save_layout=true.
save_layout=false
ini_file=project-igi-imgui.ini

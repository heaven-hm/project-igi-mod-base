name: build

on:
  push:
  pull_request:

jobs:
  quality:
    name: C++ quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install --yes clang-format clang-tidy
      - name: Configure
        run: cmake -S . -B build-quality -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DIGI_SDK_BUILD_DEMOS=ON
      - name: Check formatting
        run: cmake --build build-quality --target format_cpp_check
      - name: Lint
        run: cmake --build build-quality --target lint_cpp

  cmake:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIGI_SDK_BUILD_DEMOS=ON
      - name: Configure Win32
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A Win32 -DIGI_SDK_BUILD_DEMOS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
